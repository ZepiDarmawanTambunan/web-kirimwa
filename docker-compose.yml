services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wa_gateway}
      MYSQL_USER: ${MYSQL_USER:-wa_gateway}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - web_kirimwa_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3003}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BIND_ADDRESS: 0.0.0.0:8080
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

  baileys:
    build: ./baileys
    restart: unless-stopped
    volumes:
      - baileys_auth:/app/auth_info
    ports:
      - "4000:4000"
    depends_on:
      - mysql

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    ports:
      - "3003:3000"
    depends_on:
      - api

volumes:
  web_kirimwa_mysql_data:
  baileys_auth:
